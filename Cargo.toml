[package]
name = "mt5-bridge"
version = "0.3.0"
edition = "2021"
rust-version = "1.77"
authors = ["0xbarss <https://github.com/0xbarss>"]
description = "Fast, unofficial MetaTrader 5 API bridge and client for Rust (OHLCV, Account, Orders, Tick & Bar Streaming)"
license = "MIT"
readme = "README.md"
repository = "https://github.com/0xbarss/mt5-bridge"
homepage = "https://github.com/0xbarss/mt5-bridge"
keywords = ["metatrader", "mt5", "trading", "finance", "algorithmic-trading"]
categories = ["api-bindings", "finance", "asynchronous"]

[dependencies]
libloading = "0.8"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.0", features = ["sync", "time", "rt", "macros"], optional = true }
tracing = "0.1"
static_assertions = "1.1"
sha2 = "0.10"
hex = "0.4"
dunce = "1.0"
arc-swap = "1.7"

[features]
default = ["async", "serde_json", "wal"]
async = ["dep:tokio"]
wal = []
json-journal = ["dep:serde_json"]
serde_json = ["json-journal"]

[dev-dependencies]
tokio = { version = "1.0", features = ["full", "test-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
doc-comment = "0.3"

[[bench]]
name = "benchmarks"
harness = false

[[bench]]
name = "latency_harness"
harness = false

[[bench]]
name = "mt5_extensive_benchmark"
harness = false

[[bench]]
name = "push_probe"
harness = false

[[example]]
name = "04_stream_ticks"
required-features = ["async"]

[[example]]
name = "07_stream_bars"
required-features = ["async"]

[[example]]
name = "09_stream_bars_push"
required-features = ["async"]

[[example]]
name = "10_wal_order_store"
required-features = ["wal"]
