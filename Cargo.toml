[package]
name = "mt5-bridge"
version = "0.1.0"
edition = "2021"
authors = ["0xbarss <https://github.com/0xbarss>"]
description = "Fast, unofficial MetaTrader 5 API bridge and client for Rust (OHLCV, Account, Orders, Tick & Bar Streaming)"
license = "MIT"
readme = "README.md"
repository = "https://github.com/0xbarss/mt5-bridge"
homepage = "https://github.com/0xbarss/mt5-bridge"
keywords = ["metatrader", "mt5", "trading", "finance", "algorithmic-trading"]
categories = ["api-bindings", "finance", "asynchronous"]

[dependencies]
libloading = "0.8"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.0", features = ["sync", "time", "rt", "macros"], optional = true }
tracing = "0.1"

[features]
default = ["async", "serde_json"]
async = ["dep:tokio"]

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
