name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-check:
    name: Rust (Format, Clippy, Test, Doc)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting
        run: cargo fmt --check

      - name: Run Clippy linter
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run test suite
        run: cargo test --all-features --verbose

      - name: Check documentation
        run: cargo doc --all-features --no-deps

  feature-matrix:
    name: Feature Matrix (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - "--no-default-features"
          - "--no-default-features --features async"
          - "--no-default-features --features serde_json"
          - "--no-default-features --features wal"
          - "--all-features"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.features }}

      - name: Check feature combination
        run: cargo check ${{ matrix.features }}

      - name: Clippy feature combination
        run: cargo clippy ${{ matrix.features }} -- -D warnings

  dependency-audit:
    name: Dependency Audit (Deny & Audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny and cargo-audit
        run: cargo install cargo-deny cargo-audit --locked

      - name: Run cargo deny check
        run: cargo deny check

      - name: Run cargo audit
        run: cargo audit

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Generate code coverage
        run: cargo llvm-cov --all-features --lcov --output-path lcov.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: lcov.info
          path: lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          files: lcov.info

  msrv:
    name: MSRV Check (1.81)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@1.81.0

      - name: Verify MSRV compilation
        run: cargo check --all-features

  cross-compile-dll:
    name: MinGW DLL Cross-Compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MinGW-w64 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64

      - name: Build mt5_bridge.dll via MinGW
        run: |
          chmod +x bridge_dll/build.sh
          ./bridge_dll/build.sh

      - name: Verify DLL output
        run: |
          test -s bridge_dll/build/mt5_bridge.dll
          ls -lh bridge_dll/build/mt5_bridge.dll

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: mt5_bridge.dll
          path: bridge_dll/build/mt5_bridge.dll
          if-no-files-found: error

  cpp-tests:
    name: C++ DLL Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake

      - name: Configure C++ tests
        run: cmake -S bridge_dll/tests -B bridge_dll/tests/build

      - name: Build C++ tests
        run: cmake --build bridge_dll/tests/build --config Release

      - name: Run C++ tests
        run: ctest --test-dir bridge_dll/tests/build --output-on-failure

  fuzz:
    name: Fuzz targets (cargo-fuzz)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain (nightly)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check fuzz formatting
        run: cargo fmt --check
        working-directory: fuzz

      - name: Clippy fuzz crate
        run: cargo clippy -- -D warnings
        working-directory: fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Build all fuzz targets
        run: cargo fuzz build

  windows-build:
    name: Windows Native (Test & MSVC DLL)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run test suite on Windows
        run: cargo test --all-features

      - name: Build DLL with MSVC CMake
        run: |
          cmake -B bridge_dll/build -S bridge_dll
          cmake --build bridge_dll/build --config Release

      - name: Verify Windows DLL output
        run: |
          Get-Item bridge_dll/build/Release/mt5_bridge.dll
